<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ScreenPic sign-in</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --accent: #1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --accent: #8ab4f8; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--fg); font: 20px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 8px; background: var(--accent); color: var(--bg); text-decoration: none; }
</style>
</head>
<body>
<main>
  <p id="message">กำลังส่งสิทธิ์ไปที่ทีวี…</p>
  <a id="link" hidden>แตะเพื่อส่งไปที่ทีวี</a>
</main>
<script>
  // Google redirects here (an https page is required); this page only forwards the query to
  // the TV's LAN server named in `state` ("<nonce>.<ip>:<port>"). No data leaves the browser
  // except that one navigation, and only private IPv4 addresses are accepted.
  (function () {
    var params = new URLSearchParams(location.search);
    var state = params.get('state') || '';
    var host = state.slice(state.indexOf('.') + 1);
    var privateHost = /^(10\.\d{1,3}|172\.(1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}:\d{2,5}$/;
    var message = document.getElementById('message');
    if (!privateHost.test(host)) {
      message.textContent = 'ลิงก์ไม่ถูกต้อง เริ่มใหม่จากทีวีอีกครั้ง';
      return;
    }
    var target = 'http://' + host + '/callback' + location.search;
    var link = document.getElementById('link');
    link.href = target;
    setTimeout(function () {
      message.textContent = 'ถ้าหน้านี้ไม่เปลี่ยน ให้แตะปุ่มด้านล่าง (มือถือต้องต่อ Wi-Fi เดียวกับทีวี)';
      link.hidden = false;
    }, 2500);
    location.replace(target);
  })();
</script>
</body>
</html>
